<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LAX Interactive Map</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="icon" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <h3>服务商 / 线路 地图</h3>
    <div class="row">
      <label>填充：<b>dsp_name</b></label>
    </div>
    <div class="row">
      <label>边框：<b>polygon</b></label>
    </div>
    <div class="row">
      <label>边框粗细</label>
      <input type="range" id="strokeWidth" min="0" max="3" step="0.2" value="1.2" />
    </div>
    <div class="row">
      <input type="text" id="filterText" placeholder="筛选 DSP/Polygon/Zipcode（模糊匹配）" />
      <button id="clearBtn">清除</button>
    </div>
    <details>
      <summary>图例</summary>
      <div id="legend-dsp"></div>
      <hr/>
      <div id="legend-poly"></div>
    </details>
    <p class="tip">提示：拖动、缩放，鼠标悬停查看 ZIPCODE / DSP / 线路。</p>
  </div>

  <div id="tooltip" class="tooltip" style="display:none;"></div>

  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
